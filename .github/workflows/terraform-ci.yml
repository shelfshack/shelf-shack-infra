# Terraform CI (Phase 6): every PR gets fmt + validate + a plan for both
# environments posted as a comment; merging to main applies via the existing
# deploy-safe workflow (terraform-apply.yml), which is target-limited so CI
# can never destroy stateful infrastructure.
#
# Required secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY

name: Terraform CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '**.tf'
      - '**.tfvars'
      - 'modules/**'
      - 'envs/**'
  push:
    branches: [main]
    paths:
      - '**.tf'
      - '**.tfvars'

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    defaults:
      run:
        working-directory: envs/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform fmt
        run: terraform fmt -check -recursive ../..
        continue-on-error: true

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: |
          terraform plan -input=false -lock-timeout=60s -no-color -out=ci.tfplan 2>&1 | tee plan.txt
          echo "summary=$(grep -E 'Plan:|No changes' plan.txt | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('envs/${{ matrix.environment }}/plan.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(-60000) : plan;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: [
                '### Terraform plan · `${{ matrix.environment }}`',
                '${{ steps.plan.outputs.summary }}',
                '<details><summary>Full plan</summary>',
                '',
                '```',
                truncated,
                '```',
                '</details>',
              ].join('\n'),
            });

  apply-on-merge:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production   # requires a reviewer approval configured in repo settings
    steps:
      - uses: actions/checkout@v4
      - name: Trigger deploy-safe apply
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'terraform-apply.yml',
              ref: 'main',
              inputs: { environment: 'prod' },
            });
